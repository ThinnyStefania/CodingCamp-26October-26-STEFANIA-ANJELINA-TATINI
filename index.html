<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Expense & Budget Visualizer</h1>
      <!-- Fitur 5: Dark Mode Toggle -->
      <button id="theme-toggle" class="btn-toggle">🌙 Dark Mode</button>
    </div>

    <!-- Ringkasan Saldo -->
    <div class="card balance-card">
      <h3>TOTAL SALDO</h3>
      <h2 id="total-balance">$0.00</h2>
    </div>

    <!-- Form Tambah Transaksi -->
    <div class="card">
      <h3>Tambah Transaksi</h3>
      <form id="transaction-form">
        <label for="item-name">Nama Barang</label>
        <input type="text" id="item-name" placeholder="Contoh: Cilok" required>

        <label for="amount">Jumlah ($)</label>
        <input type="number" id="amount" step="0.01" placeholder="0" required>

        <label for="category">Kategori</label>
        <select id="category" required>
          <option value="Makanan">Makanan (Food)</option>
          <option value="Transportasi">Transportasi</option>
          <option value="Hiburan">Hiburan</option>
        </select>

        <!-- Fitur 1: Kategori Kustom -->
        <div class="custom-category-group">
          <input type="text" id="new-category" placeholder="+ Tambah kategori baru...">
          <button type="button" id="add-category-btn">Tambah Kategori</button>
        </div>

        <button type="submit" class="btn-submit">Tambah Transaksi</button>
      </form>
    </div>

    <div class="content-grid">
      <!-- Daftar Transaksi -->
      <div class="card">
        <div class="list-header">
          <h3>Transaksi</h3>
          <!-- Fitur 3: Urutkan Transaksi -->
          <select id="sort-select">
            <option value="newest">Urutan: Terbaru</option>
            <option value="amount-high">Jumlah: Tertinggi</option>
            <option value="amount-low">Jumlah: Terendah</option>
            <option value="category">Berdasarkan Kategori</option>
          </select>
        </div>
        <ul id="transaction-list"></ul>
      </div>

      <!-- Grafik -->
      <div class="card">
        <h3>Pengeluaran Berdasarkan Kategori</h3>
        <canvas id="spending-chart"></canvas>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
